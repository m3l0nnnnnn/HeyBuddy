<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HeyBuddy Floating Companion</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 194px; height: 244px; overflow: hidden; background: transparent; font-family: system-ui, "Segoe UI", sans-serif; }
  .window { position: relative; height: 244px; width: 194px; }
  .mascot-drag-area { -webkit-app-region: drag; position: absolute; top: 0; left: 0; width: 194px; height: 207px; display: flex; align-items: center; justify-content: center; cursor: grab; user-select: none; }
  .mascot { pointer-events: none; width: 185px; height: 202px; object-fit: contain; user-select: none; -webkit-user-drag: none; animation: bob 3.5s ease-in-out infinite; filter: drop-shadow(0 9px 9px #362a593d); }
  .controls { -webkit-app-region: no-drag; position: absolute; bottom: 2px; left: 9px; right: 9px; display: flex; align-items: center; justify-content: center; gap: 6px; }
  button { -webkit-app-region: no-drag; font: 800 12px system-ui, "Segoe UI", sans-serif; border: 0; cursor: pointer; border-radius: 100px; height: 31px; box-shadow: 0 4px 12px #312a5d3a; }
  .open { background: #fff; color: #5947a5; padding: 0 16px; flex: 1; }
  .hide { width: 32px; background: #f5e9f3; color: #694d69; font-size: 18px; }
  button:hover { filter: brightness(.96); }
  button:focus-visible { outline: 2px solid #6752d4; outline-offset: 2px; }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  @media (prefers-reduced-motion: reduce) { .mascot { animation: none; } }
</style>
</head>
<body>
<div class="window">
  <div class="mascot-drag-area" title="Hold and drag the mouse to move Buddy" aria-label="Drag Buddy around the desktop">
    <img class="mascot" src="../web/public/buddy-mouse.svg" alt="Friendly HeyBuddy mouse mascot" draggable="false">
  </div>
  <div class="controls">
    <button id="open" class="open" title="Open HeyBuddy dashboard">Open HeyBuddy</button>
    <button id="hide" class="hide" aria-label="Hide Buddy" title="Hide Buddy">×</button>
  </div>
</div>
<script>
  document.getElementById('open').addEventListener('click', () => window.heybuddy?.openDashboard());
  document.getElementById('hide').addEventListener('click', () => window.heybuddy?.hideBuddy());
</script>
</body>
</html>
